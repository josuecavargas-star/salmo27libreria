media:
  input: public/images/libros
  output: /images/libros
content:
  - name: libros
    label: Inventario de libros
    type: file
    path: public/data/libros.json
    format: json
    list: true
    fields:
      - name: nombre
        label: Nombre del libro
        type: string
        required: true
      - name: autor
        label: Autor
        type: string
      - name: categoria
        label: Categoría
        type: select
        required: true
        options:
          values:
            - name: biblias
              label: Biblias
            - name: literatura
              label: Literatura cristiana
            - name: regalos
              label: Regalos
        default: biblias
      - name: precio
        label: Precio
        type: number
      - name: imagen
        label: Portada
        type: image
      - name: descripcion
        label: Descripción
        type: text
      - name: disponible
        label: Disponible
        type: boolean
        default: true
