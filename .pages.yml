media:
  input: public/images/libros
  output: /images/libros
content:
  # Una colección por categoría: el colaborador ve cada
  # categoría como sección en el menú de Pages CMS y
  # agrega el producto en la sección correcta.
  # Agregar una categoría nueva = crear una colección
  # acá + una línea en public/data/index.json.
  - name: biblias-reina-valera-1960
    label: Biblias Reina Valera 1960
    type: file
    path: public/data/biblias-reina-valera-1960.json
    format: json
    list: true
    fields:
      - name: nombre
        label: Nombre del producto
        type: string
        required: true
      - name: autor
        label: Autor
        type: string
      - name: cantidad
        label: Cantidad en stock
        type: number
        default: 0
      - name: precio
        label: Precio
        type: number
      - name: imagen
        label: Portada
        type: image
      - name: descripcion
        label: Descripción
        type: text
      - name: disponible
        label: Disponible
        type: boolean
        default: true
