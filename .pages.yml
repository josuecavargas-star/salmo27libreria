media:
  input: public/images/libros
  output: /images/libros
content:
  - name: biblias
    label: Biblias
    type: file
    path: public/data/biblias.json
    format: json
    list: true
    fields:
      - name: nombre
        label: Nombre del libro
        type: string
        required: true
      - name: autor
        label: Autor
        type: string
      - name: cantidad
        label: Cantidad en stock
        type: number
        default: 0
      - name: precio
        label: Precio
        type: number
      - name: imagen
        label: Portada
        type: image
      - name: descripcion
        label: Descripción
        type: text
      - name: disponible
        label: Disponible
        type: boolean
        default: true
  - name: literatura
    label: Literatura Cristiana
    type: file
    path: public/data/literatura.json
    format: json
    list: true
    fields:
      - name: nombre
        label: Nombre del libro
        type: string
        required: true
      - name: autor
        label: Autor
        type: string
      - name: cantidad
        label: Cantidad en stock
        type: number
        default: 0
      - name: precio
        label: Precio
        type: number
      - name: imagen
        label: Portada
        type: image
      - name: descripcion
        label: Descripción
        type: text
      - name: disponible
        label: Disponible
        type: boolean
        default: true
  - name: regalos
    label: Regalos
    type: file
    path: public/data/regalos.json
    format: json
    list: true
    fields:
      - name: nombre
        label: Nombre del artículo
        type: string
        required: true
      - name: cantidad
        label: Cantidad en stock
        type: number
        default: 0
      - name: precio
        label: Precio
        type: number
      - name: imagen
        label: Portada
        type: image
      - name: descripcion
        label: Descripción
        type: text
      - name: disponible
        label: Disponible
        type: boolean
        default: true
