media:
  input: public/images/libros
  output: /images/libros
content:
  # Un solo inventario. Cada producto lleva su categoría como texto
  # libre: una categoría nueva aparece sola en el catálogo, sin tocar
  # código ni esta configuración.
  - name: libros
    label: Inventario de libros
    type: file
    path: public/data/libros.json
    format: json
    list: true
    fields:
      - name: nombre
        label: Nombre del producto
        type: string
        required: true
      - name: autor
        label: Autor
        type: string
      - name: categoria
        label: Categoría
        type: string
        required: true
      - name: cantidad
        label: Cantidad en stock
        type: number
        default: 0
      - name: precio
        label: Precio
        type: number
      - name: imagen
        label: Portada
        type: image
      - name: descripcion
        label: Descripción
        type: text
      - name: disponible
        label: Disponible
        type: boolean
        default: true
