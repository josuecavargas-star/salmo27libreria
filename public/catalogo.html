<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Catálogo de productos de Salmo 27 - Librería Cristiana en Liberia, Guanacaste. Explora nuestra colección de Biblias, literatura cristiana y artículos cristianos." />
  <title>Catálogo - Salmo 27 Librería</title>
  <link rel="shortcut icon" href="img/logoprincipal.png" type="image/png" />
  <link rel="apple-touch-icon" href="img/logoprincipal.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/carrito.css" />
  <style>
    .catalogo {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    .catalogo__title {
      text-align: center;
      font-size: 2.5rem;
      color: var(--color-primary);
      margin-bottom: 0.5rem;
    }
    .catalogo__subtitle {
      text-align: center;
      color: var(--color-text-muted);
      margin-bottom: 2.5rem;
      font-size: 1.1rem;
    }
    .grid {
      display: grid;
      gap: 24px;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      margin-top: 2rem;
    }
    .libro {
      background: var(--color-white);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease;
    }
    .libro:hover {
      transform: translateY(-3px);
    }
    .libro img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
      margin-bottom: 10px;
    }
    .sin-portada {
      width: 100%;
      aspect-ratio: 2/3;
      background: var(--color-border);
      border-radius: 8px;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      display: flex;
    }
    .sin-portada span {
      color: var(--color-text-muted);
      font-size: 14px;
    }
    .libro h3 {
      margin: 10px 0 4px;
      font-size: 17px;
      color: var(--color-primary);
    }
    .libro .autor {
      color: var(--color-text-muted);
      margin: 0 0 6px;
      font-size: 14px;
    }
    .libro .precio {
      font-weight: bold;
      font-size: 18px;
      color: var(--color-accent);
      margin: 6px 0;
    }
    .libro .descripcion {
      font-size: 13px;
      color: var(--color-text);
      margin-top: 8px;
      line-height: 1.4;
    }
    .libro .agotado {
      opacity: 0.6;
      position: relative;
    }
    .libro .agotado::after {
      content: "Agotado";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-20deg);
      background: var(--color-highlight);
      color: var(--color-white);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
    }
    .filtros {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .filtro-btn {
      background: var(--color-white);
      border: 2px solid var(--color-accent);
      color: var(--color-accent);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .filtro-btn:hover {
      background: var(--color-accent);
      color: var(--color-white);
    }
    .filtro-btn.activo {
      background: var(--color-primary);
      color: var(--color-white);
      border-color: var(--color-primary);
    }
    .categoria-badge {
      display: inline-block;
      background: var(--color-bg);
      color: var(--color-primary);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize;
      margin-bottom: 6px;
    }
    .stock-info {
      font-size: 13px;
      font-weight: 500;
      margin: 4px 0;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .stock-agotado {
      color: #dc2626;
    }
    .stock-bajo {
      color: #ea580c;
    }
    .stock-ok {
      color: var(--color-accent);
    }
    .stock-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }
    .stock-dot.agotado { background: #dc2626; }
    .stock-dot.bajo { background: #ea580c; }
    .stock-dot.ok { background: var(--color-accent); }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">
        <img src="img/logoprincipal.png" alt="Salmo 27 - Librería Cristiana" class="logo__img" />
      </a>
      <div class="social social--header">
        <a href="https://www.facebook.com/salmo27libreria" target="_blank" rel="noopener noreferrer" class="social__link" aria-label="Facebook">
          <img src="img/iconos/facebook.svg" alt="Facebook" class="social__img" />
        </a>
        <a href="https://www.instagram.com/salmo27_libreriacristiana" target="_blank" rel="noopener noreferrer" class="social__link" aria-label="Instagram">
          <img src="img/iconos/instagram.svg" alt="Instagram" class="social__img" />
        </a>
      </div>

      <button class="nav-toggle" id="navToggle" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav" id="nav">
        <a href="index.html#inicio">Inicio</a>
        <div class="nav__item--dropdown">
          <a href="catalogo.html" class="nav__dropdown-toggle">Catálogo</a>
          <button class="nav__dropdown-arrow" id="navDropdownArrow" aria-label="Mostrar categorías" aria-expanded="false" aria-controls="navDropdown">▾</button>
          <!-- El menú de categorías lo llena main.js desde data/index.json -->
          <div class="nav__dropdown" id="navDropdown"></div>
        </div>
        <a href="index.html#nosotros">Nosotros</a>
        <a href="index.html#contacto">Contacto</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="catalogo">
      <h1 class="catalogo__title">Catálogo de Productos</h1>
      <p class="catalogo__subtitle">Explora nuestra colección de libros cristianos</p>
      <div class="filtros" id="filtros"></div>
      <div id="catalogo" class="grid">Cargando libros...</div>
    </section>
  </main>

  <script>
    let librosData = [];
    let filtroActivo = 'todos';

    /* Compara categorías sin importar mayúsculas ni espacios
       extra, para que "Biblias" y "biblias" caigan en el
       mismo filtro. */
    function normalizarCategoria(texto) {
      return String(texto == null ? '' : texto)
        .trim()
        .toLowerCase()
        .replace(/[\s_-]+/g, ' ');
    }

    /* Los botones de filtro se arman solos con los grupos
       que hay en el inventario: una categoría nueva agregada
       desde Pages CMS aparece acá sin tocar código. */
    function renderFiltros() {
      const vistos = new Map();
      vistos.set('todos', 'Todos');
      for (const libro of librosData) {
        const clave = normalizarCategoria(libro.grupo);
        if (clave && !vistos.has(clave)) {
          vistos.set(clave, String(libro.grupo).trim());
        }
      }
      document.getElementById('filtros').innerHTML = [...vistos.entries()]
        .map(([clave, etiqueta]) =>
          `<button type="button" class="filtro-btn${clave === filtroActivo ? ' activo' : ''}" data-filtro="${escaparHtml(clave)}">${escaparHtml(etiqueta)}</button>`
        )
        .join('');
    }

    function escaparHtml(texto) {
      return String(texto == null ? '' : texto)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatearColones(numero) {
      const valor = Number(numero);
      if (!isFinite(valor)) return '₡0';
      return '₡' + Math.round(valor).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function getStockHtml(cantidad) {
      if (cantidad === 0 || cantidad === undefined) {
        return `<span class="stock-info stock-agotado"><span class="stock-dot agotado"></span> Agotado</span>`;
      }
      if (cantidad < 5) {
        return `<span class="stock-info stock-bajo"><span class="stock-dot bajo"></span> Últimas unidades (${cantidad})</span>`;
      }
      return `<span class="stock-info stock-ok"><span class="stock-dot ok"></span> En stock (${cantidad})</span>`;
    }

    function renderLibros() {
      const visibles = librosData.filter(libro =>
        libro.disponible !== false &&
        (filtroActivo === 'todos' ||
          normalizarCategoria(libro.grupo) === filtroActivo ||
          normalizarCategoria(libro.categoria) === filtroActivo)
      );
      const contenedor = document.getElementById('catalogo');

      if (visibles.length === 0) {
        contenedor.textContent = 'No hay libros disponibles en esta categoría.';
        return;
      }

      contenedor.innerHTML = visibles.map(libro => {
        const agotado = libro.disponible === false || !libro.cantidad;
        return `
        <article class="libro ${agotado ? 'agotado' : ''}">
          ${libro.imagen ?
            `<img src="${escaparHtml(libro.imagen)}" alt="${escaparHtml(libro.nombre)}" loading="lazy" onerror="this.style.display='none'">` :
            `<div class="sin-portada"><span>Sin portada</span></div>`
          }
          ${libro.categoria ? `<span class="categoria-badge">${escaparHtml(String(libro.categoria).trim())}</span>` : ''}
          <h3>${escaparHtml(libro.nombre)}</h3>
          ${libro.autor ? `<p class="autor">${escaparHtml(libro.autor)}</p>` : ''}
          <p class="precio">${formatearColones(libro.precio)}</p>
          ${libro.descripcion ? `<p class="descripcion">${escaparHtml(libro.descripcion)}</p>` : ''}
          ${getStockHtml(libro.cantidad)}
          <button type="button" class="libro__agregar" ${agotado ? 'disabled' : ''}
            data-agregar="1"
            data-nombre="${escaparHtml(libro.nombre)}"
            data-precio="${Number(libro.precio) || 0}"
            data-imagen="${escaparHtml(libro.imagen || '')}"
            data-categoria="${escaparHtml(String(libro.categoria).trim())}"
            data-cantidad="${Number(libro.cantidad) || 0}">
            ${agotado ? 'Agotado' : 'Agregar al carrito'}
          </button>
        </article>
      `;
      }).join('');
    }

    document.getElementById('filtros').addEventListener('click', function(e) {
      if (e.target.classList.contains('filtro-btn')) {
        const activo = document.querySelector('.filtro-btn.activo');
        if (activo) activo.classList.remove('activo');
        e.target.classList.add('activo');
        filtroActivo = e.target.dataset.filtro;
        renderLibros();
      }
    });

    /* El índice (data/index.json) dice qué archivos existen,
       cómo se llaman y a qué grupo general pertenecen. El
       catálogo los carga a todos y a cada producto le pone
       su categoría y su grupo: agregar una categoría nueva
       es configuración (.pages.yml + index.json), no código. */
    fetch('/data/index.json')
      .then(respuesta => {
        if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status);
        return respuesta.json();
      })
      .then(indice => {
        if (!Array.isArray(indice)) throw new Error('Índice inválido');
        return Promise.all(indice.map(entrada =>
          fetch('/data/' + entrada.archivo)
            .then(r => r.ok ? r.json() : [])
            .catch(() => [])
            .then(items =>
              (Array.isArray(items) ? items : [])
                .map(item => ({
                  ...item,
                  categoria: entrada.categoria,
                  grupo: entrada.grupo || entrada.categoria
                }))
            )
        ));
      })
      .then(grupos => {
        librosData = grupos.flat();
        renderFiltros();
        aplicarGrupoDeLaUrl();
        renderLibros();
      })
      .catch(() => {
        document.getElementById('catalogo').textContent = 'No se pudo cargar el catálogo. Por favor, intenta más tarde.';
      });

    /* Los enlaces del sitio (ej. catalogo.html?grupo=biblias o
       catalogo.html?categoria=Biblias NVI) dejan el filtro ya
       elegido al abrir la página. */
    function aplicarGrupoDeLaUrl() {
      const params = new URLSearchParams(window.location.search);
      const categoriaUrl = params.get('categoria');
      const grupoUrl = params.get('grupo');

      /* Subcategoría: filtra por ella y resalta el grupo
         al que pertenece. */
      if (categoriaUrl) {
        const claveCategoria = normalizarCategoria(categoriaUrl);
        const libro = librosData.find(l => normalizarCategoria(l.categoria) === claveCategoria);
        if (!libro) return;
        filtroActivo = claveCategoria;
        resaltarBotonDeGrupo(normalizarCategoria(libro.grupo));
        return;
      }

      if (grupoUrl) {
        const clave = normalizarCategoria(grupoUrl);
        if (!document.querySelector('.filtro-btn[data-filtro="' + clave + '"]')) return;
        filtroActivo = clave;
        resaltarBotonDeGrupo(clave);
      }
    }

    function resaltarBotonDeGrupo(clave) {
      const boton = document.querySelector('.filtro-btn[data-filtro="' + clave + '"]');
      if (!boton) return;
      const activo = document.querySelector('.filtro-btn.activo');
      if (activo) activo.classList.remove('activo');
      boton.classList.add('activo');
    }
  </script>
  <script src="js/main.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
